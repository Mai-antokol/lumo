<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>llumooo</title><link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap"><style>
/* ===================================================================
   DESIGN PLAN
   Color   — neutral warm-grey paper + near-black ink, so the page
             itself stays quiet; the ledger-green accent carries all
             the "ledger" character instead of tinting every surface.
             Status colors (good/warn/bad) kept apart from the accent
             hue and from the 5-way categorical work-type palette
             (validated with the dataviz skill's contrast/CVD checks).
   Type    — Hanken Grotesk for UI text, IBM Plex Mono for every number
             (amounts, dates, counts) — tabular figures read like an
             actual ledger column.
   Layout  — fixed left rail of top-level views; a main canvas that
             drills down (Projects → Project → Ticket) with breadcrumbs;
             faint horizontal rule-lines behind the canvas, like a
             ledger pad, at a level that never competes with content.
   =================================================================== */
:root{
  --bg:#F5F4F2; --surface:#FFFFFF; --surface-2:#ECEBE8; --line:#DFDEDA;
  --ink:#201F1C; --ink-soft:#615F59; --ink-faint:#96948C;
  --accent:#146356; --accent-ink:#FFFFFF; --accent-soft:#DCEEE7;
  --good:#1F8A5A; --good-soft:#E3F3EA;
  --warn:#BD6B14; --warn-soft:#FBEDDB;
  --bad:#C0453A; --bad-soft:#FBEAE7;
  --cat-plan:#4C7BE0; --cat-impl:#1F9E82; --cat-test:#C68A1E; --cat-debug:#D9637A; --cat-review:#7D5BA6;
  --rule: rgba(32,31,28,.045);
  --f-ui:"Hanken Grotesk",system-ui,-apple-system,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --r-sm:8px; --r-md:12px; --r-lg:18px;
  --shadow:0 1px 2px rgba(20,20,18,.05), 0 10px 28px rgba(20,20,18,.07);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#141413; --surface:#1C1C1A; --surface-2:#252422; --line:#34332F;
  --ink:#ECEBE7; --ink-soft:#A6A49D; --ink-faint:#716F68;
  --accent:#4FC2A4; --accent-ink:#0B2621; --accent-soft:#1E332C;
  --good:#3CBE86; --good-soft:#1A2E25;
  --warn:#E2954A; --warn-soft:#332717;
  --bad:#E27368; --bad-soft:#331F1C;
  --cat-plan:#6085D6; --cat-impl:#22A989; --cat-test:#B8872E; --cat-debug:#D96E88; --cat-review:#8C6BC9;
  --rule: rgba(255,255,255,.035);
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 28px rgba(0,0,0,.35);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#141413; --surface:#1C1C1A; --surface-2:#252422; --line:#34332F;
  --ink:#ECEBE7; --ink-soft:#A6A49D; --ink-faint:#716F68;
  --accent:#4FC2A4; --accent-ink:#0B2621; --accent-soft:#1E332C;
  --good:#3CBE86; --good-soft:#1A2E25;
  --warn:#E2954A; --warn-soft:#332717;
  --bad:#E27368; --bad-soft:#331F1C;
  --cat-plan:#6085D6; --cat-impl:#22A989; --cat-test:#B8872E; --cat-debug:#D96E88; --cat-review:#8C6BC9;
  --rule: rgba(255,255,255,.035);
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 28px rgba(0,0,0,.35);
  color-scheme:dark;
}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:14px;line-height:1.5;margin:0}
h1,h2,h3{font-family:var(--f-ui);text-wrap:balance}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
button{font-family:inherit;cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- shell ---------- */
.app{display:flex;min-height:100%}
.rail{width:228px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--line);
  padding:20px 14px;display:flex;flex-direction:column;gap:20px;position:sticky;
  top:env(safe-area-inset-top,0px);height:100vh;height:100dvh}
.brand{display:flex;align-items:center;gap:9px;padding:2px 8px 10px;font-weight:800;font-size:15.5px;letter-spacing:-.01em}
.brand svg{flex-shrink:0}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:var(--r-sm);
  color:var(--ink-soft);font-weight:600;font-size:13.5px;transition:background .14s,color .14s;flex-shrink:0}
.nav button svg{width:16px;height:16px;flex-shrink:0;opacity:.85}
.nav button:hover{background:var(--surface-2);color:var(--ink)}
.nav button[aria-current="true"]{background:var(--accent-soft);color:var(--accent)}
.rail-bottom{margin-top:auto;display:flex;flex-direction:column;gap:10px}
.rail-bottom button{flex-shrink:0}
.rail-foot{font-size:11.5px;color:var(--ink-faint);padding:0 10px}

.main{flex:1;min-width:0;padding:28px clamp(18px,3vw,40px) 60px;position:relative;
  background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 31px,var(--rule) 32px)}
.view{min-width:0}

@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeRight{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:translateX(0)}}
@keyframes fadeLeft{from{opacity:0;transform:translateX(-20px)}to{opacity:1;transform:translateX(0)}}
.anim-up{animation:fadeUp .34s cubic-bezier(.22,1,.36,1) both}
.anim-right{animation:fadeRight .34s cubic-bezier(.22,1,.36,1) both}
.anim-left{animation:fadeLeft .34s cubic-bezier(.22,1,.36,1) both}

/* ---------- header / breadcrumb ---------- */
.crumb{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-faint);margin-bottom:10px;flex-wrap:wrap}
.crumb button{all:unset;cursor:pointer;color:var(--accent);font-weight:600}
.crumb button:hover{text-decoration:underline}
.topbar{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:6px}
.eyebrow{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-faint);margin:0 0 4px}
h1{font-size:23px;margin:0;font-weight:800;letter-spacing:-.015em}
.subtext{color:var(--ink-soft);font-size:13px;margin:5px 0 0}
.subtext .sep{color:var(--ink-faint);margin:0 5px}
.rule-accent{height:3px;border-radius:3px;margin:12px 0 22px;
  background:linear-gradient(90deg,var(--cat-plan),var(--cat-impl) 35%,var(--cat-test) 60%,var(--cat-debug) 80%,var(--cat-review))}

/* ---------- pill controls ---------- */
.pillbar{display:inline-flex;background:var(--surface-2);border-radius:999px;padding:3px;gap:2px}
.pillbar button{all:unset;cursor:pointer;padding:6px 13px;font-size:12.5px;font-weight:600;color:var(--ink-soft);
  border-radius:999px;transition:background .14s,color .14s}
.pillbar button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.tabbar{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px;overflow-x:auto}
.tabbar button{all:unset;cursor:pointer;padding:9px 4px;margin-right:20px;font-weight:700;font-size:13.5px;
  color:var(--ink-faint);border-bottom:2px solid transparent;white-space:nowrap}
.tabbar button[aria-selected="true"]{color:var(--accent);border-color:var(--accent)}
.tab-panel{display:none}
.tab-panel.visible{display:block}

/* ---------- grid + cards ---------- */
.grid{display:grid;gap:14px;grid-template-columns:repeat(12,minmax(0,1fr))}
.c3{grid-column:span 3}.c4{grid-column:span 4}.c5{grid-column:span 5}.c6{grid-column:span 6}
.c7{grid-column:span 7}.c8{grid-column:span 8}.c12{grid-column:span 12}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow);
  padding:18px 20px;min-width:0;display:flex;flex-direction:column;gap:12px}
.card-label{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-soft);
  display:flex;align-items:center;justify-content:space-between;gap:8px}
.big{font-family:var(--f-mono);font-size:29px;font-weight:600;letter-spacing:-.01em;line-height:1}
.cap{color:var(--ink-soft);font-size:12.5px}
.pill-stat{font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap}
.pill-stat.good{background:var(--good-soft);color:var(--good)}
.pill-stat.warn{background:var(--warn-soft);color:var(--warn)}
.pill-stat.bad{background:var(--bad-soft);color:var(--bad)}

.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:14px;flex-wrap:wrap;margin:30px 0 12px}
.section-head:first-child{margin-top:0}
.section-title{font-size:14.5px;font-weight:800}
.section-sub{font-size:12px;color:var(--ink-soft);margin-top:2px}
.legend-row{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink-soft)}
.legend-row .sw{width:9px;height:9px;border-radius:3px;display:inline-block;margin-right:6px;vertical-align:-1px}

/* ---------- phase bar (categorical work-type) ---------- */
.phase-bar{display:flex;height:10px;border-radius:5px;overflow:hidden;gap:2px;width:100%}
.phase-bar.lg{height:26px;border-radius:8px}
.phase-seg{height:100%}
.phase-legend{display:flex;gap:22px;flex-wrap:wrap;margin-top:12px}
.phase-legend .item{display:flex;flex-direction:column;gap:3px}
.phase-legend .lbl{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--ink-soft);font-weight:600}
.phase-legend .lbl i{width:9px;height:9px;border-radius:3px}
.phase-legend .val{font-family:var(--f-mono);font-size:14.5px;font-weight:600;padding-left:16px}

/* ---------- lists / rows ---------- */
.rowlist{display:flex;flex-direction:column;gap:10px}
.rowcard{all:unset;cursor:pointer;display:grid;grid-template-columns:1.6fr .9fr .9fr 1.2fr auto;gap:16px;
  align-items:center;width:100%;box-sizing:border-box;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r-lg);box-shadow:var(--shadow);padding:15px 18px;font-size:13px;
  transition:transform .14s ease,border-color .14s ease}
.rowcard:hover{border-color:var(--accent);transform:translateY(-1px)}
.rowcard .name-wrap{display:flex;flex-direction:column;gap:4px;align-items:flex-start;text-align:left}
.rowcard .pname{font-weight:700;font-size:14px}
.rowcard .pmeta{display:flex;align-items:center;gap:8px}
.key-chip{font-family:var(--f-mono);font-size:10.5px;font-weight:700;color:var(--accent);background:var(--accent-soft);
  padding:2px 7px;border-radius:5px}
.since{font-size:11px;color:var(--ink-faint)}
.stat-lbl{font-size:10.5px;color:var(--ink-soft);font-weight:700;text-transform:uppercase;letter-spacing:.04em;margin-bottom:3px}
.stat-val{font-family:var(--f-mono);font-size:14.5px;font-weight:600}
.avatars{display:flex}
.avatar{width:25px;height:25px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:9.5px;font-weight:700;color:#fff;border:2px solid var(--surface);flex-shrink:0;margin-left:-7px}
.avatar:first-child{margin-left:0}
.flag-chip{display:inline-flex;align-items:center;gap:5px;background:var(--warn-soft);color:var(--warn);
  font-size:10.5px;font-weight:700;padding:4px 9px;border-radius:7px;white-space:nowrap}
.flag-chip svg{width:11px;height:11px}
.chev{color:var(--ink-faint);width:16px;height:16px;flex-shrink:0}
.status-chip{font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:7px;white-space:nowrap}
.status-chip.open{background:var(--accent-soft);color:var(--accent)}
.status-chip.closed{background:var(--surface-2);color:var(--ink-soft)}
.status-chip.completed{background:var(--surface-2);color:var(--ink-soft)}

@media (max-width:860px){.rowcard{grid-template-columns:1fr;gap:8px;text-align:left}}

/* ---------- insights ---------- */
.insight{all:unset;cursor:pointer;display:block;width:100%;box-sizing:border-box;border-radius:var(--r-md);
  background:var(--warn-soft);padding:12px 14px}
.insight.info{background:var(--accent-soft)}
.insight.good{background:var(--good-soft)}
.insight-head{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:start}
.insight b.dot{width:7px;height:7px;border-radius:50%;background:var(--warn);margin-top:6px}
.insight.info b.dot{background:var(--accent)}
.insight.good b.dot{background:var(--good)}
.insight p{margin:0;font-weight:600;font-size:13px;text-align:left}
.insight .why{display:block;font-size:12px;color:var(--ink-soft);margin-top:3px;font-weight:500;text-align:left}
.insight .more{color:var(--ink-faint);font-size:12px;white-space:nowrap}
.insight-detail{text-align:left;font-size:12.5px;color:var(--ink-soft);padding:10px 2px 2px 17px;line-height:1.55}

/* ---------- AI sources mini bars ---------- */
.src-row{display:grid;grid-template-columns:110px minmax(0,1fr) auto;gap:12px;align-items:center;font-size:13px;padding:6px 0}
.src-row .track{height:9px;background:var(--surface-2);border-radius:4px;overflow:hidden}
.src-row .fill{height:100%;background:var(--accent);border-radius:4px}
.src-row .amt{font-family:var(--f-mono);font-weight:600;text-align:right;min-width:60px}

/* ---------- tickets-over-time gantt (project overview) ---------- */
.gantt-wrap{overflow-x:auto;padding-bottom:2px}
.gantt-axis{display:grid;grid-template-columns:168px minmax(0,1fr) auto;gap:14px;align-items:end;min-width:620px;margin-bottom:6px}
.gantt-axis-ticks{position:relative;height:16px}
.gantt-axis-ticks span{position:absolute;font-family:var(--f-mono);font-size:10.5px;color:var(--ink-faint);transform:translateX(-50%);white-space:nowrap}
.gantt-axis-ticks span:first-child{transform:translateX(0)}
.gantt-axis-ticks span:last-child{transform:translateX(-100%)}
.gantt-rows{display:flex;flex-direction:column;gap:6px;min-width:620px}
.gantt-row{all:unset;cursor:pointer;display:grid;grid-template-columns:168px minmax(0,1fr) auto;gap:14px;align-items:center;
  width:100%;box-sizing:border-box;padding:8px;border-radius:var(--r-sm);transition:background .12s}
.gantt-row:hover{background:var(--surface-2)}
.gantt-row:hover .gantt-bar{filter:brightness(1.08)}
.gantt-label{display:flex;flex-direction:column;gap:2px;text-align:left;min-width:0}
.gantt-label .tkey{font-family:var(--f-mono);font-size:11px;color:var(--accent);font-weight:700}
.gantt-label .gttl{font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gantt-track{position:relative;height:18px;background:var(--surface-2);border-radius:6px}
.gantt-bar{position:absolute;top:3px;bottom:3px;border-radius:5px;transition:filter .12s}
.gantt-bar::before{content:"";position:absolute;left:-4px;top:50%;width:9px;height:9px;margin-top:-4.5px;
  border-radius:50%;background:inherit;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--line)}
.gantt-bar.open::after{content:"";position:absolute;right:-4px;top:50%;width:7px;height:7px;margin-top:-3.5px;
  border-radius:50%;background:inherit;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--line)}
.gantt-cost{font-family:var(--f-mono);font-weight:600;text-align:right;min-width:62px}

/* ---------- tables ---------- */
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-soft);font-weight:700;
  padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr.clickable{cursor:pointer;transition:background .12s}
tr.clickable:hover td{background:var(--surface-2)}
th.r,td.r{text-align:right}
.person{display:flex;align-items:center;gap:9px}
.person-name{font-weight:600}
.mini-bar{display:flex;height:7px;width:100px;border-radius:4px;overflow:hidden;gap:1px}

/* ---------- verdict pills ---------- */
.verdict{font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap;display:inline-block}
.verdict.good{background:var(--good-soft);color:var(--good)}
.verdict.mid{background:var(--warn-soft);color:var(--warn)}
.verdict.bad{background:var(--bad-soft);color:var(--bad)}

/* ---------- compare two tickets ---------- */
.vs{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.vs .side{border:1px solid var(--line);border-radius:var(--r-md);padding:15px;display:flex;flex-direction:column;gap:10px;min-width:0}
.vs h4{margin:0;font-size:14px}
.chain{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px;font-size:12.5px}
.chain li{display:grid;grid-template-columns:14px 1fr;gap:8px;align-items:start}
.chain li::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--line);margin-top:5px}
.chain li.ok::before{background:var(--good)}
.chain li.warn::before{background:var(--warn)}
@media (max-width:860px){.vs{grid-template-columns:1fr}}

/* ---------- ticket detail: session timeline ---------- */
.sess-strip{overflow-x:auto;padding-bottom:10px}
.sess-items{display:flex;gap:22px;position:relative;padding:20px 4px 4px;min-width:min-content}
.sess-axis{position:absolute;top:26px;left:4px;right:4px;height:2px;background:var(--line);z-index:0}
.sess-item{width:160px;flex-shrink:0;position:relative;z-index:1}
.sess-dot{width:13px;height:13px;border-radius:50%;border:3px solid var(--surface);box-shadow:0 0 0 1px var(--line);margin-bottom:10px}
.sess-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);box-shadow:var(--shadow);padding:12px 13px}
.sess-date{font-size:10.5px;color:var(--ink-faint);font-weight:600;margin-bottom:8px}
.sess-person{display:flex;align-items:center;gap:7px;margin-bottom:8px}
.sess-tool{font-size:10.5px;color:var(--ink-faint);font-weight:600;margin-bottom:6px}
.sess-cost{font-family:var(--f-mono);font-weight:700;font-size:14px;margin-bottom:8px}
.sess-flags{display:flex;flex-direction:column;gap:5px}
.sig-chip{display:inline-flex;align-items:center;gap:5px;background:var(--surface-2);color:var(--ink-soft);
  font-size:10px;font-weight:700;padding:3px 8px;border-radius:7px;width:fit-content}
.sig-chip svg{width:11px;height:11px}
.sig-chip.hot{background:var(--bad-soft);color:var(--bad)}

/* ---------- repositories ---------- */
.repo-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow);
  padding:18px 20px;display:flex;flex-direction:column;gap:12px}
.repo-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.repo-name{font-weight:700;font-size:14.5px}
.repo-proj{font-size:11.5px;color:var(--ink-faint)}
.ring{width:54px;height:54px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;position:relative}
.ring .hole{position:absolute;inset:6px;background:var(--surface);border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-family:var(--f-mono);font-size:12.5px;font-weight:700}
.repo-kv{display:grid;grid-template-columns:1fr auto;gap:6px 10px;font-size:12.5px}
.repo-kv dt{color:var(--ink-soft);margin:0}
.repo-kv dd{margin:0;text-align:right;font-family:var(--f-mono)}
.docs-chip{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:6px}
.docs-chip.good{background:var(--good-soft);color:var(--good)}
.docs-chip.mid{background:var(--warn-soft);color:var(--warn)}
.docs-chip.bad{background:var(--bad-soft);color:var(--bad)}
.repo-fix{font-size:12.5px;color:var(--ink-soft);border-left:2px solid var(--line);padding-left:10px;margin:0}

/* ---------- setup ---------- */
.conn{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.conn:first-of-type{border-top:0}
.logo-badge{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:13px;color:#fff;flex-shrink:0}
.conn-meta{flex:1;min-width:0}
.conn-meta .name{font-weight:700;font-size:13.5px}
.conn-meta .sub{color:var(--ink-soft);font-size:12px}
.btn{all:unset;cursor:pointer;font-size:12.5px;font-weight:700;padding:7px 13px;border-radius:999px;
  border:1px solid var(--line);background:var(--surface);color:var(--ink);transition:background .14s}
.btn.on{color:var(--good);background:var(--good-soft);border-color:transparent}

/* Picks a tool for session i of n so that, across the whole ticket, the mix
   approximates this project's AI_SOURCES cost ratio. Demo-data heuristic only. */
function toolForIndex(sources, i, n){
  if(!sources || !sources.length) return 'Claude Code';
  const total = sources.reduce((a,s)=>a+s.cost,0) || 1;
  const frac = (i + 0.5) / n;
  let cum = 0;
  for(const s of sources){
    cum += s.cost / total;
    if(frac <= cum) return s.name;
  }
  return sources[sources.length - 1].name;
}
function autoSessions(t, projectKey){
  const cats = CAT_LIST.filter(k => t.phases[k] > 0);
  const n = Math.max(2, Math.min(t.assignees.length + 1, t.sessions, 5));
  const per = Math.round(t.cost / n);
  const sources = AI_SOURCES[projectKey] || [];
  return Array.from({length:n}).map((_,i) => ({
    date: i===0 ? t.started : (i===n-1 ? t.last : 'mid-ticket'),
    employee: t.assignees[i % t.assignees.length],
    cost: i===n-1 ? t.cost - per*(n-1) : per,
    cat: cats[i % cats.length] || 'impl',
    tool: toolForIndex(sources, i, n),
    flags: [],
  }));
}

function reveal(id, direction){
  document.querySelectorAll('.view').forEach(v => { v.hidden = v.id !== id; });
  const el = document.getElementById(id);
  el.classList.remove('anim-up','anim-right','anim-left');
  el.getBoundingClientRect();
  el.classList.add(direction === 'right' ? 'anim-right' : direction === 'left' ? 'anim-left' : 'anim-up');
}
function setNavActive(view){
  document.querySelectorAll('#nav button').forEach(b => b.removeAttribute('aria-current'));
  const topLevel = {overview:'overview', projects:'projects', project:'projects', ticket:'projects', repos:'repos'};
  const key = topLevel[view];
  if(key){ const btn = document.querySelector(`#nav button[data-nav="${key}"]`); if(btn) btn.setAttribute('aria-current','true'); }
}
function go(view, direction){
  setNavActive(view);
  reveal('view-' + view, direction || 'up');

        <div class="card c3"><div class="card-label">Closed tickets</div><div class="big num">${closedCount}</div><div class="cap">of ${tickets.length} tracked here</div></div>
        ${vsHTML ? `<div class="card c12"><div class="card-label">Two tickets from this project</div>${vsHTML}</div>` : ''}
        <div class="card c12">
          <div class="card-label">Tickets: AI spend vs. outcome</div>
          <div class="tbl-wrap"><table>
            <thead><tr><th>Task</th><th class="r">AI spend</th><th class="r">Sessions</th><th class="r">Lines</th><th class="r">Reviews</th><th class="r">Follow-up bugs</th><th>Outcome</th></tr></thead>
            <tbody>${outcomesRows}</tbody>
          </table></div>
          <p class="note" style="margin-top:10px">Outcome summarizes evidence about the work, not about the person. It never ranks people.</p>
        </div>
      </div>
    </div>
  `;
  document.getElementById('pd-tabs').addEventListener('click', e => {
    const b = e.target.closest('button[data-tab]'); if(!b) return;
    document.querySelectorAll('#pd-tabs button').forEach(x => x.setAttribute('aria-selected','false'));
    b.setAttribute('aria-selected','true');
    ['overview','contributors','outcomes'].forEach(id => {
      const p = document.getElementById('pd-'+id);
      p.classList.toggle('visible', id === b.dataset.tab);
    });
    const panel = document.getElementById('pd-'+b.dataset.tab);
    panel.classList.remove('anim-up'); panel.getBoundingClientRect(); panel.classList.add('anim-up');
  });
  go('project','right');
}
function dominantCat(phases){ return CAT_LIST.reduce((best,k) => (phases[k]||0) > (phases[best]||0) ? k : best, CAT_LIST[0]); }

const MONTH_SHORT = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function dayLabel(origin, dayOffset){
  const dt = new Date(origin + 'T00:00:00');
  dt.setDate(dt.getDate() + Math.round(dayOffset));
  return MONTH_SHORT[dt.getMonth()] + ' ' + dt.getDate();
}
function ganttChartHTML(key, tickets){
  const meta = TIMELINE_META[key];
  if(!meta || !tickets.length) return '<p class="note">No tickets to chart yet.</p>';
  const nowDay = meta.nowDay;
  const tickCount = 5;
  const axisHTML = Array.from({length:tickCount}).map((_,i) => {
    const d = Math.round(i/(tickCount-1) * nowDay);
    const pct = d/nowDay*100;
    return `<span style="left:${pct}%">${dayLabel(meta.origin, d)}</span>`;
  }).join('');
  const rows = tickets.slice().sort((a,b) => a.tStart - b.tStart).map(t => {
    const left = Math.min(t.tStart/nowDay*100, 96);
    const width = Math.max(t.tSpan/nowDay*100, 4);
    const color = CAT_VAR[dominantCat(t.phases)];
    return `<button class="gantt-row" onclick="openTicket('${key}','${t.key}')" title="${t.key} · ${dayLabel(meta.origin,t.tStart)} – ${t.status==='open' ? 'ongoing' : dayLabel(meta.origin,t.tStart+t.tSpan)}">
      <div class="gantt-label"><span class="tkey">${t.key}</span><span class="gttl">${t.title}</span></div>
      <div class="gantt-track"><div class="gantt-bar${t.status==='open'?' open':''}" style="left:${left}%;width:${width}%;background:${color}"></div></div>
      <span class="gantt-cost num">${fmtMoney(t.cost)}</span>
    </button>`;
  }).join('');
  return `<div class="gantt-wrap">
    <div class="gantt-axis"><span></span><div class="gantt-axis-ticks">${axisHTML}</div><span></span></div>
    <div class="gantt-rows">${rows}</div>
  </div>`;
}
function toggleInsight(btn){
  const detail = btn.querySelector('.insight-detail');
  const open = btn.getAttribute('aria-expanded') === 'true';
  btn.setAttribute('aria-expanded', String(!open));
  detail.hidden = open;
  if(!open){ detail.classList.remove('anim-up'); detail.getBoundingClientRect(); detail.classList.add('anim-up'); }
}

/* ================= TICKET DETAIL ================= */
function openTicket(projectKey, ticketKey){
  const t = (TICKETS[projectKey]||[]).find(x => x.key === ticketKey);
  if(!t) return;
  const meta = ctx.isCompleted ? COMPLETED_META[projectKey] : PROJECT_META[projectKey];
  const sessions = SESSIONS[ticketKey] || autoSessions(t, projectKey);

  const sessHTML = sessions.map(s => `
    <div class="sess-item">
      <div class="sess-dot" style="background:${CAT_VAR[s.cat]}"></div>
      <div class="sess-card">
        <div class="sess-date">${s.date}</div>
        <div class="sess-person">${avatarsHTML([s.employee],22)}<span style="font-size:11.5px;font-weight:600">${s.employee}</span></div>
        <div class="sess-tool">${s.tool}</div>
        <div class="sess-cost num">${fmtMoney(s.cost)}</div>
        <div class="sess-flags">${s.flags.map(fk => `<span class="sig-chip hot" title="${FLAG_META[fk].tip}">${FLAG_META[fk].icon}${FLAG_META[fk].label}</span>`).join('')}</div>
      </div>
    </div>`).join('');

  const toolAgg = {};
  sessions.forEach(s => { toolAgg[s.tool] = (toolAgg[s.tool] || 0) + s.cost; });
  const toolRows = Object.entries(toolAgg).sort((a,b) => b[1]-a[1]);
  const toolTotal = toolRows.reduce((a,r) => a+r[1], 0) || 1;
  const maxTool = Math.max(...toolRows.map(r => r[1]), 1);
  const toolHTML = toolRows.map(([name,cost]) => `
    <div class="src-row"><span>${name}</span>
      <div class="track"><div class="fill" style="width:${cost/maxTool*100}%"></div></div>
      <span class="amt num">${fmtMoney(cost)}</span></div>`).join('') +
    (toolRows[0] ? `<p class="note" style="margin-top:6px">${Math.round(toolRows[0][1]/toolTotal*100)}% of this ticket's spend runs through ${toolRows[0][0]}.</p>` : '');

  const agg = {};
  sessions.forEach(s => { if(!agg[s.employee]) agg[s.employee] = {cost:0,sessions:0,phases:{plan:0,impl:0,test:0,debug:0,review:0}}; agg[s.employee].cost += s.cost; agg[s.employee].sessions += 1; agg[s.employee].phases[s.cat] += 1; });
  const contribRows = Object.entries(agg).map(([name,d]) => {
    const tot = Object.values(d.phases).reduce((a,b)=>a+b,0) || 1;
    const pct = {}; CAT_LIST.forEach(k => pct[k] = Math.round(d.phases[k]/tot*100));
    return `<tr><td><div class="person">${avatarsHTML([name],26)}<span class="person-name">${name}</span></div></td>
      <td><div class="mini-bar">${phaseBarHTML(pct)}</div></td>
      <td class="r num">${d.sessions}</td>
      <td class="r num" style="font-weight:600">${fmtMoney(d.cost)}</td></tr>`;
  }).join('');

  document.getElementById('view-ticket').innerHTML = `
    <div class="crumb">
      <button onclick="go('projects','left')">Projects</button><span>/</span>
      <button onclick="go('project','left')">${meta.name}</button><span>/</span><span>${t.key}</span>
    </div>
    <div class="topbar">
      <div><p class="eyebrow">${t.key}</p><h1>${t.title}</h1>
        <p class="subtext">${t.assignees.length} contributor${t.assignees.length>1?'s':''}<span class="sep">·</span>started ${t.started}<span class="sep">·</span>last activity ${t.last}</p></div>
      <div style="display:flex;gap:8px;align-items:center">
        <span class="status-chip ${t.status}" style="padding:7px 13px;font-size:12px">${t.status==='open'?'Open':'Closed'}</span>
        <span class="verdict ${t.verdict}" style="padding:7px 13px;font-size:12px">${t.verdict==='good'?'Shipped clean':t.verdict==='mid'?'Needs follow-up':'Reworked'}</span>
      </div>
    </div>
    <div class="rule-accent"></div>

    <div class="grid" style="margin-bottom:22px">
      <div class="card c7">
        <div class="card-label">Where this ticket's budget went<span class="num" style="font-size:19px;font-weight:700;color:var(--ink);text-transform:none;letter-spacing:0">${fmtMoney(t.cost)}</span></div>
        <div class="phase-bar lg">${phaseBarHTML(t.phases)}</div>
        <div class="phase-legend">${phaseLegendHTML(t.phases, t.cost)}</div>
      </div>
      <div class="card c5">
        <div class="card-label">AI tools on this ticket</div>
        <div style="display:flex;flex-direction:column;gap:4px">${toolHTML}</div>
      </div>
    </div>

    <div class="section-head">
      <div><div class="section-title">Session timeline</div><div class="section-sub">One card per AI session matched to this ticket</div></div>
      <div class="legend-row">${Object.values(FLAG_META).map(f=>`<span class="sig-chip">${f.icon}${f.label}</span>`).join('')}</div>
    </div>
    <div class="sess-strip"><div class="sess-items">${sessHTML}</div></div>

    <div class="section-head"><div><div class="section-title">Contributors on this ticket</div></div></div>
    <div class="card c12">
      <div class="tbl-wrap"><table>
        <thead><tr><th>Contributor</th><th>Work-type split</th><th class="r">Sessions</th><th class="r">Cost</th></tr></thead>
        <tbody>${contribRows}</tbody>
      </table></div>
    </div>
  `;
  go('ticket','right');
}

/* ================= REPOSITORIES ================= */
function renderRepos(){
  const cards = REPOS.map(r => {
    const band = readinessBand(r.readiness);
    const color = band==='good' ? 'var(--good)' : band==='mid' ? 'var(--warn)' : 'var(--bad)';
    const trackColor = band==='good' ? 'var(--good-soft)' : band==='mid' ? 'var(--warn-soft)' : 'var(--bad-soft)';
    return `<div class="repo-card">
      <div class="repo-top">
        <div><div class="repo-name">${r.name}</div><div class="repo-proj">${r.project}</div></div>
        <div class="ring" style="background:conic-gradient(${color} ${r.readiness}%, ${trackColor} 0)">
          <div class="hole" style="color:${color}">${r.readiness}</div>
        </div>
      </div>
      <dl class="repo-kv">
        <dt>AI sessions</dt><dd class="num">${r.sessions}</dd>
        <dt>Merged without rework</dt><dd class="num">${r.mergedClean}%</dd>
        <dt>AI iterations / task</dt><dd class="num">${r.iter}</dd>
        <dt>Test coverage</dt><dd class="num">${r.coverage}%</dd>
        <dt>Docs</dt><dd><span class="docs-chip ${r.docs}">${docsLabel(r.docs)}</span></dd>
      </dl>
      <p class="repo-fix">${r.fix}</p>
    </div>`;
  }).join('');

  document.getElementById('view-repos').innerHTML = `
    <div class="topbar">
      <div><p class="eyebrow">Portfolio</p><h1>Where does AI work well?</h1>
        <p class="subtext">AI readiness per repository, learned from how AI-assisted work actually went there</p></div>
    </div>
    <div class="rule-accent"></div>
    <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(260px,1fr))">${cards}</div>

    <div class="section-head"><div><div class="section-title">The loop</div><div class="section-sub">Why this score moves over time</div></div></div>
    <div class="loop-card">
      <ul class="chain">
        <li>AI works in the codebase every day</li>
        <li>This page shows where it struggles, and why</li>
        <li class="warn">The team improves tests, docs and boundaries there</li>
        <li class="ok">AI gets more effective, and the score moves</li>
      </ul>
    </div>
  `;
}
